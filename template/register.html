<!DOCTYPE html>
<html>
<head>
    <title>活動報名 </title>
</head>
<body>
    <h2>活動報名表單</h2>
    
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    {% if success %}
        <p style="color: green;">{{ success }}</p>
    {% endif %}

    <form method="post">
        <label>姓名 :</label><br>
        <input type="text" name="name" required><br><br>
        
        <label>連絡電話 :</label><br>
        <input type="text" name="phone" required><br><br>
        
        <button type="submit">送出報名 </button>
    </form>
</body>
</html>
